name: Worker quality and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Worker quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build


  verify-production:
    name: Cloudflare production verification
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
      url: https://leo-xi.samet-krt.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Wait for existing Cloudflare Workers Builds deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-worker-build.mjs
      - name: Verify live Worker APIs and titles route
        run: node scripts/verify-live-worker.mjs
