name: Update EA club data
on:
  schedule:
    # Four chances after match night, following Amsterdam daylight saving time.
    - cron: '17 3 * * *'
      timezone: Europe/Amsterdam
    - cron: '17 4 * * *'
      timezone: Europe/Amsterdam
    - cron: '17 5 * * *'
      timezone: Europe/Amsterdam
    - cron: '17 6 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Compare Node and Python HTTP clients once
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-club-data.yml'
      - 'scripts/update-club-data.mjs'
      - 'scripts/fetch-ea-json.py'
      - 'lib/club-feed.mjs'
permissions:
  contents: write
concurrency:
  group: leo-xi-ea-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch, validate and publish the last 10 EA league matches
        run: node scripts/update-club-data.mjs --matches-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EA_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics && '1' || '0' }}
