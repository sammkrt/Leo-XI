name: Update EA club data
on:
  schedule:
    # Daily after match night, following Amsterdam daylight saving time.
    - cron: '17 4 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-club-data.yml'
      - 'scripts/update-club-data.mjs'
      - 'lib/club-feed.mjs'
permissions:
  contents: write
concurrency:
  group: leo-xi-ea-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fetch, validate and publish EA data
        run: node scripts/update-club-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
